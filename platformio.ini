; LCTech ESP32-WROOM-32E 16-channel relay board
; Flashed through the C3 SuperMini USB-TTL bridge (115200, no auto-reset).
;
; Before Upload: on the relay board hold IO0, tap EN, release IO0.
; After Upload: tap EN on the relay board (IO0 not held).

[env:relay]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM9
upload_speed = 115200
monitor_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 4MB
; default.csv has two app slots. OTA will not work on a huge_app table.
board_build.partitions = default.csv
; Do not set use_1200bps_touch. esp32dev has no such flag, so "no" is kept
; as a string and treated as true. That pulse boots the C3 bridge, not the relay.
; before/after must be board options. upload_flags are prepended and esptool
; keeps the later default_reset, which also boots the C3.
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
upload_flags =
    --connect-attempts=30
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    tzapu/WiFiManager @ ^2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Later updates over Wi-Fi. The board must already be on the network.
; If heating.local does not resolve, pass the IP:
;   pio run -t upload -e relay-ota --upload-port 192.168.x.x
[env:relay-ota]
extends = env:relay
upload_protocol = espota
upload_port = heating.local
upload_flags =
    --auth=heatota
