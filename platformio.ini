; LCTech ESP32-WROOM-32E 16-channel relay board
; Flashed through the C3 SuperMini USB-TTL bridge (115200, no auto-reset).
;
; Before Upload: on the relay board hold IO0, tap EN, release IO0.
; After Upload: tap EN on the relay board (IO0 not held).
;
; The JC3248W535C panel is env:remote — USB-C on the display, never this COM port.

[platformio]
default_envs = relay

[env:relay]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM9
upload_speed = 115200
monitor_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 4MB
; default.csv has two app slots. OTA will not work on a huge_app table.
board_build.partitions = default.csv
; Do not set use_1200bps_touch. esp32dev has no such flag, so "no" is kept
; as a string and treated as true. That pulse boots the C3 bridge, not the relay.
; before/after must be board options. upload_flags are prepended and esptool
; keeps the later default_reset, which also boots the C3.
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
build_src_filter = +<*> -<remote/>
upload_flags =
    --connect-attempts=30
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    tzapu/WiFiManager @ ^2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Later updates over Wi-Fi. The board must already be on the network.
; If heating.local does not resolve, pass the IP:
;   pio run -t upload -e relay-ota --upload-port 192.168.x.x
[env:relay-ota]
extends = env:relay
upload_protocol = espota
upload_port = heating.local
upload_flags =
    --auth=heatota

; Guition JC3248W535C 3.5" IPS (ESP32-S3 N16R8, AXS15231B QSPI). Plug USB-C
; into the panel. Do not flash this env through the C3 SuperMini.
[env:remote]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<remote/>
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
build_flags =
    -I include
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.0
    tzapu/WiFiManager @ ^2.0.17

; Later updates over Wi-Fi. Password heatota.
;   pio run -t upload -e remote-ota
; If heat-remote.local does not resolve:
;   pio run -t upload -e remote-ota --upload-port 192.168.x.x
[env:remote-ota]
extends = env:remote
upload_protocol = espota
upload_port = heat-remote.local
upload_flags =
    --auth=heatota
