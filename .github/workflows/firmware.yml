name: Firmware

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build relay and remote
        run: pio run -e relay -e remote

      - name: Name the panel binary
        run: cp .pio/build/remote/firmware.bin remote.bin

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .pio/build/relay/firmware.bin
            remote.bin

      - name: Keep workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/relay/firmware.bin
            remote.bin
